spring:
  application:
    name: bed-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:beds}
    username: ${DB_USER:beds}
    password: ${DB_PASSWORD:beds}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo gestiona Flyway
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true

app:
  kafka:
    create-topics: true
    topics:
      admissions: his.admission-requested
      bed-events: beds.bed-events
  outbox:
    relay-enabled: true
    poll-interval: 500   # ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/liveness y /readiness para Kubernetes

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
